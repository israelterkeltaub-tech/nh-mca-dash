name: Deploy NH MCA Dash backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy SAM backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Recover managed SAM stack
        run: |
          region='${{ secrets.AWS_REGION || 'us-east-1' }}'
          app_stack='nh-mca-dash'
          managed_stack='aws-sam-cli-managed-default'
          status=$(aws cloudformation describe-stacks --region "$region" --stack-name "$managed_stack" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo MISSING)
          if [[ "$status" == "REVIEW_IN_PROGRESS" || "$status" == "ROLLBACK_COMPLETE" || "$status" == "ROLLBACK_FAILED" ]]; then
            echo "Deleting stuck stack '$managed_stack' in $region..."
            aws cloudformation delete-stack --region "$region" --stack-name "$managed_stack"
            aws cloudformation wait stack-delete-complete --region "$region" --stack-name "$managed_stack"
            echo "Deleted '$managed_stack'."
          fi
          status=$(aws cloudformation describe-stacks --region "$region" --stack-name "$app_stack" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo MISSING)
          if [[ "$status" == "ROLLBACK_COMPLETE" || "$status" == "ROLLBACK_FAILED" || "$status" == "CREATE_FAILED" ]]; then
            echo "Deleting failed app stack '$app_stack' in $region..."
            aws cloudformation delete-stack --region "$region" --stack-name "$app_stack"
            aws cloudformation wait stack-delete-complete --region "$region" --stack-name "$app_stack"
            echo "Deleted '$app_stack'."
          fi

      - name: Ensure artifact bucket exists
        working-directory: backend
        run: |
          bucket="${{ secrets.AWS_FRONTEND_BUCKET || 'nh-mca-dash-frontend' }}"
          if ! aws s3 ls "s3://$bucket" >/dev/null 2>&1; then
            aws s3 mb "s3://$bucket" --region "${{ secrets.AWS_REGION || 'us-east-1' }}"
          fi
          aws cloudformation package \
            --template-file sam-template.yaml \
            --s3-bucket "$bucket" \
            --output-template-file packaged-template.yaml \
            --region "${{ secrets.AWS_REGION || 'us-east-1' }}"
          aws cloudformation deploy \
            --template-file packaged-template.yaml \
            --stack-name nh-mca-dash \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --region "${{ secrets.AWS_REGION || 'us-east-1' }}"
