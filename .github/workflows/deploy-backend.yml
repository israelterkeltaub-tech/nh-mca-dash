name: Deploy NH MCA Dash backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy SAM backend
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-2' }}

      - name: Recover managed SAM stack
        run: |
          $region = '${{ secrets.AWS_REGION || 'us-east-2' }}'
          $managedStack = 'aws-sam-cli-managed-default'
          $status = aws cloudformation describe-stacks --region $region --stack-name $managedStack --query 'Stacks[0].StackStatus' --output text 2>$null
          if ($LASTEXITCODE -eq 0 -and $status -eq 'REVIEW_IN_PROGRESS') {
            Write-Output \"Deleting stuck stack '$managedStack' in $region...\"
            aws cloudformation delete-stack --region $region --stack-name $managedStack
            aws cloudformation wait stack-delete-complete --region $region --stack-name $managedStack
            Write-Output \"Deleted '$managedStack'.\"
          }

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Deploy
        working-directory: backend
        run: |
          sam build --template-file sam-template.yaml
          sam deploy --template-file sam-template.yaml --no-confirm-changeset --no-fail-on-empty-changeset --capabilities CAPABILITY_IAM --resolve-s3 --stack-name nh-mca-dash --region ${{ secrets.AWS_REGION || 'us-east-2' }}
