name: Deploy NH MCA Dash backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy SAM backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Recover managed SAM stack
        run: |
          region='${{ secrets.AWS_REGION || 'us-east-1' }}'
          managed_stack='aws-sam-cli-managed-default'
          status=$(aws cloudformation describe-stacks --region "$region" --stack-name "$managed_stack" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo MISSING)
          if [[ "$status" == "REVIEW_IN_PROGRESS" ]]; then
            echo "Deleting stuck stack '$managed_stack' in $region..."
            aws cloudformation delete-stack --region "$region" --stack-name "$managed_stack"
            aws cloudformation wait stack-delete-complete --region "$region" --stack-name "$managed_stack"
            echo "Deleted '$managed_stack'."
          fi

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Deploy
        working-directory: backend
        run: |
          sam build --template-file sam-template.yaml
          sam deploy --template-file sam-template.yaml --no-confirm-changeset --no-fail-on-empty-changeset --capabilities CAPABILITY_IAM --resolve-s3 --stack-name nh-mca-dash --region ${{ secrets.AWS_REGION || 'us-east-1' }}
